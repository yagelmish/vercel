<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- רקע גרדיאנט כהה -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="100%" stop-color="#030108" />
    </linearGradient>

    <!-- גרדיאנט טורקיז לרכיב -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <!-- אפקט זוהר -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- רקע מעוגל לכרטיסייה -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- פינים עליונים ותחתונים -->
  <g stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="22" y1="10" x2="22" y2="14" />
    <line x1="32" y1="10" x2="32" y2="14" />
    <line x1="42" y1="10" x2="42" y2="14" />
    <line x1="22" y1="50" x2="22" y2="54" />
    <line x1="32" y1="50" x2="32" y2="54" />
    <line x1="42" y1="50" x2="42" y2="54" />
    
    <!-- פינים ימניים ושמאליים -->
    <line x1="10" y1="22" x2="14" y2="22" />
    <line x1="10" y1="32" x2="14" y2="32" />
    <line x1="10" y1="42" x2="14" y2="42" />
    <line x1="50" y1="22" x2="54" y2="22" />
    <line x1="50" y1="32" x2="54" y2="32" />
    <line x1="50" y1="42" x2="54" y2="42" />
  </g>

  <!-- גוף השבב הראשי -->
  <rect x="15" y="15" width="34" height="34" rx="6" fill="#0d0b1a" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>

  <!-- ליבת השבב (Die) -->
  <rect x="23" y="23" width="18" height="18" rx="3" fill="url(#cyanGrad)" opacity="0.9"/>

  <!-- פסי חיבור ומוליכים פנימיים -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="19" cy="19" r="1.5" fill="#00f0ff" opacity="0.7"/>
</svg>
